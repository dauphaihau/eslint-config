name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck package
        run: pnpm --filter @dauphaihau/eslint-config typecheck

      - name: Test package
        run: pnpm --filter @dauphaihau/eslint-config test

      - name: Build package
        run: pnpm --filter @dauphaihau/eslint-config build

      - name: Publish package
        working-directory: packages/eslint-config
        run: npm publish --provenance --access public
